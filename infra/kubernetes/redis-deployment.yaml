apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-redis
  namespace: hms-emr
  labels:
    app: hms-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms-redis
  template:
    metadata:
      labels:
        app: hms-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ['redis-server', '--appendonly', 'yes']
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
---
apiVersion: v1
kind: Service
metadata:
  name: hms-redis-service
  namespace: hms-emr
spec:
  selector:
    app: hms-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
