apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hms-ingress
  namespace: hms-emr
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - hms.example.com
        - api.hms.example.com
      secretName: hms-tls
  rules:
    - host: hms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hms-web-service
                port:
                  number: 3000
    - host: api.hms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hms-api-service
                port:
                  number: 3001
