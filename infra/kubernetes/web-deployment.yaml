apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-web
  namespace: hms-emr
  labels:
    app: hms-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hms-web
  template:
    metadata:
      labels:
        app: hms-web
    spec:
      containers:
        - name: hms-web
          image: hms-emr/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: hms-config
                  key: api-url
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hms-web-service
  namespace: hms-emr
spec:
  selector:
    app: hms-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
