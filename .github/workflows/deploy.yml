name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/hms-emr/api:latest
            ${{ secrets.REGISTRY_URL }}/hms-emr/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/hms-emr/web:latest
            ${{ secrets.REGISTRY_URL }}/hms-emr/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Update image tags
        run: |
          export KUBECONFIG=./kubeconfig
          kubectl set image deployment/hms-api hms-api=${{ secrets.REGISTRY_URL }}/hms-emr/api:${{ github.sha }} -n hms-emr
          kubectl set image deployment/hms-web hms-web=${{ secrets.REGISTRY_URL }}/hms-emr/web:${{ github.sha }} -n hms-emr

      - name: Wait for rollout
        run: |
          export KUBECONFIG=./kubeconfig
          kubectl rollout status deployment/hms-api -n hms-emr --timeout=300s
          kubectl rollout status deployment/hms-web -n hms-emr --timeout=300s
